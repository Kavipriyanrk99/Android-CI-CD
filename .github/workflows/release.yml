name: App Release
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Select build variant'
        type: choice
        options:
          - Release
          - IndiaProdRelease
          - UsaProdRelease
        default: Release
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - run: chmod +x ./gradlew

      - name: decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/release.keystore.jks"

      - name: build release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assemble${{ inputs.variant || 'Release' }} bundle${{ inputs.variant || 'Release' }} --stacktrace

      - name: install firebase cli
        run: curl -sL https://firebase.tools | bash

      - name: distribute APK to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          find app/build/ -type f -name "*.apk" | while read -r apk; do
                firebase appdistribution:distribute "$apk" \
                  --app "${{ secrets.FIREBASE_APP_ID }}" \
                  --groups "qa" \
                  --release-notes "$(git log -1 --pretty=%B)"
              done

      - name: upload bundle and mapping
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle
            app/build/outputs/mapping
          retention-days: 90
