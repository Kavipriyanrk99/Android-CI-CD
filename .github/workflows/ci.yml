name: Android CI
on:
  pull_request:
    branches: [ main ]
    # Documentation-only changes do not need an Android build.
    paths-ignore: [ '**/*.md' ]
  push:
    branches: [ main ]
    # Documentation-only changes do not need an Android build.
    paths-ignore: [ '**/*.md' ]


# Groups workflow runs by workflow name and branch.
# If a new run starts for the same workflow and branch,
# GitHub automatically cancels the previous run still in progress.
# Example: If you push 3 commits to the same branch quickly, GitHub cancels the workflow running
# for commit 1 and commit 2, keeping the latest run (commit 3).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run instrumentation tests on multiple Android API levels
    # to verify compatibility across different Android versions.
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 29, 31, 34, 36 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify JDK version
        run: java --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run all variant unit tests
        run: ./gradlew test --stacktrace

      - name: Run lints
        run: ./gradlew lint --stacktrace

      # instrumentation test
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-x86_64

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedAndroidTest --stacktrace

      - name: Assemble release (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      # always() ensures reports are uploaded even when an
      # earlier test, lint, or build step fails.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-*.html
            app/build/reports/androidTests
            app/build/outputs/androidTest-results/**/*.xml
          retention-days: 7