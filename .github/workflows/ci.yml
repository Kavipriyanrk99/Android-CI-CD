name: Android CI
on:
  pull_request:
    branches: [ main ]
    # Documentation-only changes do not need an Android build.
    paths-ignore: [ '**/*.md' ]
  push:
    branches: [ main ]
    # Documentation-only changes do not need an Android build.
    paths-ignore: [ '**/*.md' ]


# Groups workflow runs by workflow name and branch.
# If a new run starts for the same workflow and branch,
# GitHub automatically cancels the previous run still in progress.
# Example: If you push 3 commits to the same branch quickly, GitHub cancels the workflow running
# for commit 1 and commit 2, keeping the latest run (commit 3).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify JDK version
        run: java --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run all variant unit tests
        run: ./gradlew test --stacktrace

      - name: Run lints
        run: ./gradlew lint --stacktrace

      - name: Assemble release (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      # always() ensures reports are uploaded even when an
      # earlier test, lint, or build step fails.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-reports
          path: |
            ./app/build/reports/tests
            ./app/build/reports/lint-results-*.html
          retention-days: 7